# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to test, build and publish a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            dir=agent-watch_${GITHUB_REF_NAME}_${os}_${arch}
            exe=agent-watch
            [ "$os" = windows ] && exe=agent-watch.exe
            mkdir "$dir"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$dir/$exe" .
            cp LICENSE README.md "$dir/"
            if [ "$os" = windows ]; then zip -qr "dist/$dir.zip" "$dir"; else tar -czf "dist/$dir.tar.gz" "$dir"; fi
          done
          cd dist && sha256sum * > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
